<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
    <defs>
        <!-- Degradado lila principal -->
        <linearGradient id="lilaGradiente" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C5A3FF" />
            <stop offset="100%" stop-color="#845EC2" />
        </linearGradient>
    </defs>

    <!-- Isotipo Minimalista: Tarjetas de estudio/páginas apiladas -->
    <g transform="translate(20, 25)">
        <!-- Tarjeta trasera (lila muy claro) -->
        <rect x="20" y="0" width="45" height="60" rx="6" fill="#F3ECFF" />
        
        <!-- Tarjeta intermedia (lila medio) -->
        <rect x="10" y="8" width="45" height="60" rx="6" fill="#DBC4FF" />
        
        <!-- Tarjeta frontal (degradado lila fuerte) -->
        <rect x="0" y="16" width="45" height="60" rx="6" fill="url(#lilaGradiente)" />
        
        <!-- Detalles de líneas minimalistas en la tarjeta frontal -->
        <line x1="12" y1="36" x2="33" y2="36" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
        <line x1="12" y1="50" x2="25" y2="50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Tipografía del Logotipo -->
    <g transform="translate(100, 60)">
        <!-- Texto superior sutil -->
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#6B7280" letter-spacing="3">
            LOS TEMAZOS DE
        </text>
        
        <!-- Nombre principal destacado en lila -->
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#lilaGradiente)" letter-spacing="0.5">
            BadVanne
        </text>
    </g>
</svg>
