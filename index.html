<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf9ff">
    <title>Temas · BadVanne</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="barra-superior">
        <a class="logo" href="#temas" aria-label="BadVanne, ir a temas">
            <img src="src/gemini-svg.svg" alt="Los temazos de BadVanne">
        </a>

        <nav class="navegacion" aria-label="Navegación principal">
            <a href="#temas" aria-current="page">Temas</a>
            <span class="separador" aria-hidden="true"></span>
            <a href="#info">Info</a>
            <span id="usuario-activo" class="usuario-activo" hidden></span>
            <button id="btn-cerrar-sesion" class="boton-secundario" type="button" hidden>Cerrar sesión</button>
        </nav>
    </header>

    <main id="panel-acceso" class="panel-acceso">
        <form id="form-acceso" class="form-acceso">
            <p class="sobretitulo">Acceso privado</p>
            <h1>Iniciar sesión</h1>
            <p class="introduccion">Accede con la cuenta que te han creado en Supabase.</p>

            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="btn-iniciar-sesion" class="boton-principal" type="submit">Iniciar sesión</button>
            <p id="estado-acceso" class="estado-formulario" role="status" aria-live="polite"></p>
        </form>
    </main>

    <main id="temas" class="contenido-principal" hidden>
        <section id="vista-lista" aria-labelledby="titulo-lista">
            <div class="encabezado-principal">
                <p class="sobretitulo">Tu espacio de estudio</p>
                <h1 id="titulo-lista">Temas</h1>
                <p class="introduccion">Consulta y organiza tus temas por materia.</p>
            </div>
            <div id="materias" class="materias" aria-live="polite">
                <p class="estado-datos">Conectando con Supabase…</p>
            </div>
        </section>

        <section id="vista-detalle" class="vista-detalle" aria-labelledby="detalle-titulo" hidden>
            <header class="encabezado-detalle">
                <h1 id="detalle-titulo" tabindex="-1"></h1>
            </header>

            <button id="btn-volver" class="boton-volver" type="button">← Volver a temas</button>

            <section class="panel-reforma" aria-labelledby="titulo-reforma">
                <h2 id="titulo-reforma">Reforma pendiente</h2>
                <label class="control-reforma">
                    <input id="chk-reforma-detalle" type="checkbox">
                    <span>Este tema tiene una reforma pendiente</span>
                </label>
            </section>

            <section class="panel-vueltas" aria-labelledby="titulo-vueltas">
                <div class="encabezado-vueltas">
                    <h2 id="titulo-vueltas">Vueltas registradas</h2>
                    <button id="btn-anadir-vuelta" class="boton-anadir-vuelta" type="button">
                        <span class="icono-boton" aria-hidden="true">+</span>
                        Añadir vuelta
                    </button>
                </div>
                <div class="tabla-contenedor">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Número de vuelta</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-vueltas"></tbody>
                    </table>
                </div>
                <p id="estado-vuelta" class="estado-vuelta" role="status" aria-live="polite"></p>
            </section>
        </section>
    </main>

    <footer id="info" class="pie-pagina">
        <p id="estado-datos" role="status" aria-live="polite">Cargando temas…</p>
    </footer>
    <script type="module" src="/app.js"></script>
</body>
</html>
